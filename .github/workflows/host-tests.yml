name: Host-side tests

# Runs test/lacp and test/stp_gaps.sh (see docs/test-loop.md) against the RTLPlayground fork.
# Pick another fork branch with workflow_dispatch -> fork_ref.
# Runs on the self-hosted Windows runner; the tests run in a Linux container (scripts/ci-host-tests.sh).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      fork_ref:
        description: Branch/tag/SHA of NishantJh/RTLPlayground to test
        default: main

jobs:
  test:
    # Self-hosted runner on a personal PC: never run code from fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      # fork_ref input, else the fork branch named like this branch, else main
      - name: Pick the fork ref
        id: fork
        run: |
          $ref = '${{ inputs.fork_ref }}'
          if (-not $ref) {
            $b = '${{ github.head_ref || github.ref_name }}'
            git ls-remote --exit-code --heads https://github.com/NishantJh/RTLPlayground.git $b *> $null
            if ($LASTEXITCODE -eq 0) { $ref = $b } else { $ref = 'main' }
          }
          "ref=$ref" | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          exit 0

      - uses: actions/checkout@v4
        with:
          repository: NishantJh/RTLPlayground
          ref: ${{ steps.fork.outputs.ref }}
          path: rtlplayground

      - name: Host-side tests (in a Linux container)
        run: docker run --rm -v "${env:GITHUB_WORKSPACE}:/w" debian:trixie-slim sh /w/scripts/ci-host-tests.sh /w