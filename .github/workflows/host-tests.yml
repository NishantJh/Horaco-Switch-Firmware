name: Host-side tests

# Runs test/lacp and test/stp_gaps.sh (see docs/test-loop.md) against the RTLPlayground fork.
# Pick another fork branch with workflow_dispatch -> fork_ref.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      fork_ref:
        description: Branch/tag/SHA of NishantJh/RTLPlayground to test
        default: main

jobs:
  test:
    # Self-hosted runner on a personal PC: never run code from fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: 'C:\Program Files\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: NishantJh/RTLPlayground
          ref: ${{ inputs.fork_ref || 'main' }}
          path: rtlplayground

      # run.sh always exits 0 after the test binary, so check the output.
      # "GAP:" lines are known missing features, not failures.
      - name: LACP state machine tests
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w gcc:14 sh test/lacp/run.sh /w/rtlplayground /w/test/lacp | tee lacp.log
          grep -q '^ALL PASSED' lacp.log
          ! grep -q '^FAIL' lacp.log

      - name: RSTP gap checks (GAP lines are informational)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w gcc:14 sh test/stp_gaps.sh /w/rtlplayground
