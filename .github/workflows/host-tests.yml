name: Host-side tests

# Runs test/lacp and test/stp_gaps.sh (see docs/test-loop.md) against the RTLPlayground fork.
# Pick another fork branch with workflow_dispatch -> fork_ref.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      fork_ref:
        description: Branch/tag/SHA of NishantJh/RTLPlayground to test
        default: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: NishantJh/RTLPlayground
          ref: ${{ inputs.fork_ref || 'main' }}
          path: rtlplayground

      # run.sh always exits 0 after the test binary, so check the output.
      # "GAP:" lines are known missing features, not failures.
      - name: LACP state machine tests
        run: |
          sh test/lacp/run.sh "$PWD/rtlplayground" "$PWD/test/lacp" | tee lacp.log
          grep -q '^ALL PASSED' lacp.log
          ! grep -q '^FAIL' lacp.log

      - name: RSTP gap checks (GAP lines are informational)
        run: sh test/stp_gaps.sh "$PWD/rtlplayground"

      - name: check-dump.py self-test (synthetic dump)
        run: |
          python3 - <<'PY'
          import os
          pay = os.urandom(980436)
          d = bytearray(b'\xff' * 0x200000); d[:len(pay)] = pay
          for n in ('d1.bin', 'd2.bin'): open(n, 'wb').write(d)
          open('v.bin', 'wb').write(bytes.fromhex('12345678') + bytes(16) + pay)
          open('bad.bin', 'wb').write(b'\xff' * 0x200000)
          PY
          python3 scripts/check-dump.py d1.bin d2.bin --vendor v.bin
          ! python3 scripts/check-dump.py d1.bin bad.bin
