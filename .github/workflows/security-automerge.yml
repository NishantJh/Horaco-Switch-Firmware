name: Dependabot security auto-merge
# Merges a Dependabot pull request that fixes a known vulnerability, once every other check on it has passed.
# Routine version updates are left for the owner. No code from the pull request is checked out or run here.
# Needs the self-hosted runner for this repo to be online.
on:
  pull_request_target:
permissions:
  contents: write
  pull-requests: write
  checks: read
jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.meta.outputs.ghsa-id != ''
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const passed = ["success", "neutral", "skipped"];
            let settled = 0;
            for (let i = 0; i < 110; i++) {
              const { data } = await github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 });
              const others = data.check_runs.filter((r) => r.name !== "automerge");
              if (others.some((r) => r.status === "completed" && !passed.includes(r.conclusion))) {
                core.setFailed("A check failed; leaving the pull request for the owner.");
                return;
              }
              // Require two quiet polls in a row so checks that start late are not missed.
              settled = others.length > 0 && others.every((r) => r.status === "completed") ? settled + 1 : 0;
              if (settled >= 2) {
                await github.rest.pulls.merge({ owner, repo, pull_number, merge_method: "squash", sha });
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 30000));
            }
            core.setFailed("Timed out waiting for checks.");
